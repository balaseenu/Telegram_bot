name: Run Telegram.py

on:
  schedule:
    - cron: "30,45 3 * * 1-5"
    # 04:00–15:45 UTC
    - cron: "*/15 4-15 * * 1-5"
    # 16:00–16:30 UTC
    - cron: "0,15,30 16 * * 1-5"
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run script with secrets
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python Telegram.py
